[package]
name = "miniq-desktop"
version = "0.1.34"
edition = "2021"
license = "MIT"

# Standalone package: kept out of the root cargo workspace so daemon tests
# stay fast and Tauri's heavy dependency tree is only built for the app.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
miniq-local = { path = "../../../crates/miniq-local" }
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-dialog = "2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
futures-util = "0.3"
http-range = "0.1"
mime_guess = "2"
tokio = { version = "1", features = ["fs", "io-util", "net", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tokio-tungstenite = "0.26"
url = "2"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
# Enables Windows system proxy discovery for the updater's shared reqwest client.
reqwest = { version = "0.13", default-features = false, features = ["system-proxy"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows = "0.61.3"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
# WKWebView's completion handler is an Objective-C block.  Keep these
# bindings target-specific so Linux and Windows builds do not gain an
# unnecessary Apple framework dependency.
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSObject", "NSError", "NSString"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKWebView", "block2"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
