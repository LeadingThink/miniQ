[package]
name = "miniq-desktop"
version = "0.1.12"
edition = "2021"
license = "MIT"

# Standalone package: kept out of the root cargo workspace so daemon tests
# stay fast and Tauri's heavy dependency tree is only built for the app.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-dialog = "2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
# Enables Windows system proxy discovery for the updater's shared reqwest client.
reqwest = { version = "0.13", default-features = false, features = ["system-proxy"] }

[dev-dependencies]
tempfile = "3"
