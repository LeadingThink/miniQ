[package]
name = "miniq-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"

# Standalone package: kept out of the root cargo workspace so daemon tests
# stay fast and Tauri's heavy dependency tree is only built for the app.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2.5.4"
