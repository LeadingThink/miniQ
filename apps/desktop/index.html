<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2f2f5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./miniq-icon.png" />
    <title>miniQ</title>
    <!-- miniq-theme-bootstrap -->
    <style>
      /* Inline splash: visible as soon as the HTML parses, long before the
         JS bundle loads. Removed by main.tsx after React's first paint. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: var(--canvas, var(--theme-page, #f4f5f1));
        transition: opacity 0.25s ease;
      }
      #splash.splash-hide {
        opacity: 0;
        pointer-events: none;
      }
      #splash .splash-mark {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Inter Variable", "MiSans VF", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 34px;
        font-weight: 700;
        color: var(--accent-fg, #ffffff);
        background: var(--theme-accent, #14775f);
        animation: splash-pulse 1.4s ease-in-out infinite;
      }
      #splash .splash-name {
        font-family: "Inter Variable", "MiSans VF", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0;
        color: var(--text-dim, var(--theme-text, #17191d));
      }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.92); opacity: 0.75; }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .splash-mark { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="splash-mark">Q</div>
      <div class="splash-name">miniQ</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
