[workspace]
resolver = "2"
members = [
    "crates/miniq-protocol",
    "crates/miniq-memory",
    "crates/miniq-session-connectors",
    "crates/miniq-models",
    "crates/miniq-agent",
    "crates/miniq-sandbox",
    "crates/miniq-skills",
    "crates/miniq-docs",
    "crates/miniq-tools",
    "crates/miniq-daemon",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
rusqlite = { version = "0.33", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
async-trait = "0.1"
tokio-util = "0.7"
ignore = "0.4"
globset = "0.4"
regex = "1"
html2text = "0.12"
url = "2"
serde_yaml = "0.9"
calamine = "0.26"
rust_xlsxwriter = "0.79"
docx-rs = "0.4"
pdf-extract = "0.7"
zip = "2"
quick-xml = "0.37"
csv = "1"
similar = "2"
