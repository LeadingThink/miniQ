name: Publish background videos

on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: Only verify the public Qiniu copies
        type: boolean
        default: false

concurrency:
  group: miniq-background-videos
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Mirror pinned background videos to Qiniu
        working-directory: apps/desktop/scripts
        env:
          QINIU_ACCESS_KEY: ${{ secrets.QINIU_ACCESS_KEY }}
          QINIU_SECRET_KEY: ${{ secrets.QINIU_SECRET_KEY }}
          QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
          QINIU_DOMAIN: https://oss.zaiwen.top
        run: |
          python -m pip install 'qiniu==7.18.0'
          python upload_qiniu_backgrounds.py ${{ inputs.verify_only && '--verify-only' || '' }}
