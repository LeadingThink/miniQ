name: Build Desktop Apps
on:
  workflow_dispatch:
jobs:
  diagnose-conpty:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-x86_64-pc-windows-msvc
      - name: Diagnose managed pipe and ConPTY completion
        shell: bash
        run: cargo test --release --locked -p miniq-tools --lib windows_completed_jobs_close_transports_and_drain_output_without_polling --target x86_64-pc-windows-msvc -- --nocapture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conpty-diagnostics
          path: artifacts/conpty-diagnostics
          if-no-files-found: ignore
