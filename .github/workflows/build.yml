name: Build Desktop Apps
on:
  workflow_dispatch:
jobs:
  verify-conpty:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-x86_64-pc-windows-msvc
          cache-on-failure: true
      - name: Verify native Windows process cleanup and startup cursor handling
        shell: bash
        run: |
          cargo test --release --locked -p miniq-tools --lib process:: --target x86_64-pc-windows-msvc -- --nocapture
      - name: Verify model stream cancellation
        shell: bash
        run: |
          cargo test --release --locked -p miniq-models --lib sse:: --target x86_64-pc-windows-msvc -- --nocapture
