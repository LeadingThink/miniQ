name: Daemon lifecycle

on:
  pull_request:
    paths:
      - 'crates/miniq-local/**'
      - 'crates/miniq-cli/**'
      - 'crates/miniq-tools/src/process.rs'
      - 'crates/miniq-tools/src/process/**'
      - 'crates/miniq-daemon/src/gateway/terminal.rs'
      - 'crates/miniq-daemon/src/main.rs'
      - 'apps/desktop/src-tauri/src/daemon/**'
      - 'apps/desktop/src-tauri/src/daemon.rs'
      - 'apps/desktop/scripts/prepare-ripgrep*'
      - 'apps/desktop/src-tauri/tauri.conf.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/daemon-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test bundled ripgrep preparation
        working-directory: apps/desktop
        run: |
          npm run test:ripgrep
          npm run prepare:ripgrep
      - name: Test native process identities, startup, shutdown and CLI integration
        run: cargo test --locked -p miniq-local -p miniq-cli
      - name: Test embedded terminal capabilities and native line editing
        run: cargo test --locked --no-default-features -p miniq-tools --lib process::tests::terminal_tests
