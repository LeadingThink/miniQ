name: Release Desktop Update

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Release platform (Android never publishes desktop updater metadata)
        required: true
        default: desktop
        type: choice
        options:
          - desktop
          - android
      tag:
        description: Existing source tag, for example v0.1.3
        required: true
        type: string
      notes:
        description: Release notes shown in the updater
        required: false
        default: ""
        type: string
      windows_only:
        description: Build and publish only Windows
        required: true
        default: false
        type: boolean
      include_linux:
        description: Include Linux when building all desktop platforms
        required: true
        default: true
        type: boolean
      draft:
        description: Create a draft release
        required: true
        default: false
        type: boolean

jobs:
  validate:
    if: ${{ inputs.platform != 'android' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Validate release version
        working-directory: apps/desktop
        run: npm run release:check-version -- ${{ inputs.tag }}
      - name: Test release manifest builder
        working-directory: apps/desktop
        run: |
          npm run test:release-manifest
          npm run test:qiniu-publisher
          node --test scripts/linux-terminal.node-test.mjs
          node --test ../../scripts/install-cli.node-test.mjs

  # Server binaries must not inherit the desktop runner's glibc or GUI libraries.
  # Debian 11 establishes glibc 2.31, below Ubuntu 20.10 / common server baselines.
  terminal-linux:
    needs: validate
    if: ${{ !inputs.windows_only && inputs.include_linux }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build server terminal on glibc 2.31
        run: |
          docker run --rm -v "$PWD:/source" -w /source \
            rust:1.93.0-bullseye@sha256:b133cf54916a628618368930a4735dfc7b23fa9d1880afe32c4bb2dafbc845d9 \
            bash -euxo pipefail -c '
              export LZMA_API_STATIC=1 BZIP2_NO_PKG_CONFIG=1
              cargo build --release --locked --no-default-features -p miniq-daemon -p miniq-cli \
                --bin miniq-daemon --bin miniq --target x86_64-unknown-linux-gnu
              cargo test --release --locked --no-default-features -p miniq-tools --lib computer::tests
            '
      - name: Verify glibc baseline and runtime dependencies
        run: node apps/desktop/scripts/linux-terminal.mjs target/x86_64-unknown-linux-gnu/release
      - name: Boot CLI and bridge in a clean server image
        run: |
          docker run --rm --network none \
            -v "$PWD/target/x86_64-unknown-linux-gnu/release:/opt/miniq:ro" \
            -e PATH=/opt/miniq:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            debian:bullseye-slim bash -euxo pipefail -c '
              miniq --version
              miniq --data-dir /tmp/miniq-smoke rpc daemon.health
              miniq --data-dir /tmp/miniq-smoke bridge </dev/null | grep miniq_bridge_ready
              miniq --data-dir /tmp/miniq-smoke rpc daemon.shutdownIfIdle
            '
      - name: Package portable Linux terminal
        run: |
          stage="$(mktemp -d)"
          cp target/x86_64-unknown-linux-gnu/release/miniq "$stage/"
          cp target/x86_64-unknown-linux-gnu/release/miniq-daemon "$stage/"
          cp docs/terminal.md "$stage/README.md"
          mkdir -p dist-terminal
          tar -czf dist-terminal/x86_64-unknown-linux-gnu.terminal.tar.gz -C "$stage" .
      - uses: actions/upload-artifact@v4
        with:
          name: miniq-release-x86_64-unknown-linux-gnu-terminal
          path: dist-terminal/*.terminal.tar.gz
          if-no-files-found: error

  build:
    needs: validate
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.windows_only && '[{"os":"windows-latest","target":"x86_64-pc-windows-msvc","bundles":"nsis"}]' || inputs.include_linux && '[{"os":"windows-latest","target":"x86_64-pc-windows-msvc","bundles":"nsis"},{"os":"macos-latest","target":"aarch64-apple-darwin","bundles":"app,dmg"},{"os":"macos-latest","target":"x86_64-apple-darwin","bundles":"app,dmg"},{"os":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu","bundles":"deb,appimage"}]' || '[{"os":"windows-latest","target":"x86_64-pc-windows-msvc","bundles":"nsis"},{"os":"macos-latest","target":"aarch64-apple-darwin","bundles":"app,dmg"},{"os":"macos-latest","target":"x86_64-apple-darwin","bundles":"app,dmg"}]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl \
            wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            pkg-config libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev \
            libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev libxkbcommon-dev
          pkg-config --exists libpipewire-0.3 wayland-client wayland-server egl gbm xcb
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> apps/desktop/src-tauri/target
      - name: Build daemon and terminal client
        run: cargo build --release --locked -p miniq-daemon -p miniq-cli --bin miniq-daemon --bin miniq --target ${{ matrix.target }}
      - name: Build Windows terminal launcher
        if: runner.os == 'Windows'
        run: cargo build --release --locked -p miniq-cli --bin miniq-launcher --target ${{ matrix.target }}
      - name: Verify native Windows terminal installation and safe updates
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-install-cli.ps1 -Binaries "target/${{ matrix.target }}/release"
      - name: Test terminal on native platforms
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --locked -p miniq-cli -p miniq-local --target ${{ matrix.target }}
      - name: Package terminal client and daemon
        if: runner.os != 'Linux'
        shell: bash
        run: |
          stage="$(mktemp -d)"
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          cp "target/${{ matrix.target }}/release/miniq${ext}" "$stage/"
          cp "target/${{ matrix.target }}/release/miniq-daemon${ext}" "$stage/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/miniq-launcher.exe" "$stage/"
          fi
          cp docs/terminal.md "$stage/README.md"
          mkdir -p dist-terminal
          tar -czf "dist-terminal/${{ matrix.target }}.terminal.tar.gz" -C "$stage" .
      - name: Place daemon sidecar
        shell: bash
        run: |
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          mkdir -p apps/desktop/src-tauri/binaries
          cp "target/${{ matrix.target }}/release/miniq-daemon${ext}" \
             "apps/desktop/src-tauri/binaries/miniq-daemon-${{ matrix.target }}${ext}"
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Build release bundles
        working-directory: apps/desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MINIQ_SKIP_DAEMON_SIDECAR: "1"
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            apple_signing_ready=true
            for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
              APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              if [ -z "${!name}" ]; then apple_signing_ready=false; fi
            done
            if [ "$apple_signing_ready" != "true" ]; then
              echo "::warning title=Unsigned macOS build::Apple signing is incomplete; publishing an unsigned DMG with the installation guide."
              unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY
              unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            fi
          fi
          npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Verify macOS microphone permission in signed application
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        shell: bash
        run: |
          node --test scripts/macos_privacy.node-test.mjs
          node scripts/macos_privacy.mjs app "src-tauri/target/${{ matrix.target }}/release/bundle/macos/miniQ.app"
      - uses: actions/upload-artifact@v4
        with:
          name: miniq-release-${{ matrix.target }}
          path: |
            dist-terminal/*.terminal.tar.gz
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error

  publish:
    needs: [build, terminal-linux]
    if: ${{ always() && needs.build.result == 'success' && (needs.terminal-linux.result == 'success' || needs.terminal-linux.result == 'skipped') }}
    concurrency:
      group: miniq-shared-download-manifest
      cancel-in-progress: false
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          pattern: miniq-release-*
          path: dist-release/artifacts
      - name: Assemble platform assets and latest.json
        working-directory: apps/desktop
        env:
          RELEASE_NOTES: ${{ inputs.notes }}
        run: >-
          node scripts/build-release-manifest.mjs
          --input ../../dist-release/artifacts
          --output ../../dist-release/publish
          --tag ${{ inputs.tag }}
          --asset-base-url https://oss.zaiwen.top/releases/miniq/${{ inputs.tag }}
          --mirror-base-url https://github.com/LeadingThink/miniQ-releases/releases/download/${{ inputs.tag }}
          --required-platforms ${{ inputs.windows_only && 'windows-x86_64' || inputs.include_linux && 'windows-x86_64,darwin-aarch64,darwin-x86_64,linux-x86_64' || 'windows-x86_64,darwin-aarch64,darwin-x86_64' }}
      - name: Publish Qiniu primary download origin
        env:
          QINIU_ACCESS_KEY: ${{ secrets.QINIU_ACCESS_KEY }}
          QINIU_SECRET_KEY: ${{ secrets.QINIU_SECRET_KEY }}
          QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
          QINIU_DOMAIN: https://oss.zaiwen.top
          QINIU_LEGACY_BUCKET: miniq-zaiwenai
          QINIU_LEGACY_DOMAIN: https://miniq.zaiwenai.com
        run: |
          python -m pip install 'qiniu==7.18.0'
          python apps/desktop/scripts/upload_qiniu_release.py \
            --input dist-release/publish \
            --tag "${{ inputs.tag }}"
      - name: Select GitHub mirror update manifest
        run: mv dist-release/publish/latest.github.json dist-release/publish/latest.json
      - name: Create or update public release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_NOTES: ${{ inputs.notes }}
          RELEASE_DRAFT: ${{ inputs.draft }}
          WINDOWS_ONLY: ${{ inputs.windows_only }}
          INCLUDE_LINUX: ${{ inputs.include_linux }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo LeadingThink/miniQ-releases >/dev/null 2>&1; then
            args=(release create "$RELEASE_TAG" --repo LeadingThink/miniQ-releases \
              --target main --title "miniQ $RELEASE_TAG")
            if [ "$RELEASE_DRAFT" = "true" ]; then args+=(--draft); fi
            if [ -n "$RELEASE_NOTES" ]; then
              args+=(--notes "$RELEASE_NOTES")
            else
              if [ "$WINDOWS_ONLY" = "true" ]; then
                args+=(--notes "miniQ desktop release for Windows.")
              elif [ "$INCLUDE_LINUX" = "true" ]; then
                args+=(--notes "miniQ desktop release for Windows, macOS, and Linux.")
              else
                args+=(--notes "miniQ desktop release for Windows and macOS.")
              fi
            fi
            gh "${args[@]}"
          fi
          gh release upload "$RELEASE_TAG" dist-release/publish/* --clobber \
            --repo LeadingThink/miniQ-releases

  android:
    if: ${{ inputs.platform == 'android' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    concurrency:
      group: miniq-shared-download-manifest
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_DRAFT: ${{ inputs.draft }}
    defaults:
      run:
        working-directory: apps/desktop
        shell: bash
    steps:
      - name: Reject Android draft publication
        working-directory: ${{ github.workspace }}
        run: |
          if [ "$RELEASE_DRAFT" != "false" ]; then
            echo "::error::Android releases require draft=false; draft publication is not supported."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Validate Android source tag and version
        run: |
          git show-ref --verify "refs/tags/$RELEASE_TAG"
          test "$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")" = "$(git rev-parse HEAD)"
          python3 scripts/android_release.py validate --tag "$RELEASE_TAG"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Test and build mobile frontend
        run: |
          npm ci
          python3 scripts/android_release_test.py
          npm run test:mobile
          npm run build
          npx cap sync android
      - name: Prepare dedicated release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 scripts/android_release.py prepare-signing
      - name: Build and verify signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          sdkmanager 'build-tools;36.0.0' 'platforms;android-36'
          cd android
          bash gradlew --no-daemon assembleRelease
          cd ..
          version="${RELEASE_TAG#android-v}"
          mkdir -p ../../dist-android
          apk="../../dist-android/miniQ_${version}_android.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          python3 scripts/android_release.py verify --tag "$RELEASE_TAG" --apk "$apk" --tools "$ANDROID_HOME/build-tools/36.0.0"
      - name: Remove temporary signing material
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/miniq-android-release.keystore"
      - uses: actions/upload-artifact@v4
        with:
          name: miniq-android-${{ inputs.tag }}
          path: dist-android/*.apk
          if-no-files-found: error
      - name: Publish identical APK to public mirror without changing latest release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          args=(--repo LeadingThink/miniQ-releases --latest=false)
          if gh release view "$RELEASE_TAG" --repo LeadingThink/miniQ-releases >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" "${args[@]}" --draft=false
          else
            gh release create "$RELEASE_TAG" "${args[@]}" --target main \
              --title "miniQ Android ${RELEASE_TAG#android-v}" \
              --notes "${RELEASE_NOTES:-miniQ Android release. Debug-signed installations must be uninstalled first; local app data will be removed.}"
          fi
          gh release upload "$RELEASE_TAG" "../../dist-android/miniQ_${RELEASE_TAG#android-v}_android.apk" \
            --repo LeadingThink/miniQ-releases --clobber
      - name: Verify mirror and publish Android Qiniu origin and shared download manifest
        env:
          QINIU_ACCESS_KEY: ${{ secrets.QINIU_ACCESS_KEY }}
          QINIU_SECRET_KEY: ${{ secrets.QINIU_SECRET_KEY }}
          QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
        run: |
          python3 -m pip install 'qiniu==7.18.0'
          python3 scripts/android_release.py publish --tag "$RELEASE_TAG" \
            --apk "../../dist-android/miniQ_${RELEASE_TAG#android-v}_android.apk"
