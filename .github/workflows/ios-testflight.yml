name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: App Store version shown to testers (for example 1.0)
        required: true
        default: "1.0"
        type: string
      build_number:
        description: Positive integer greater than every build already uploaded for this version
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: miniq-ios-testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    env:
      CI: "1"
      IOS_MARKETING_VERSION: ${{ inputs.marketing_version }}
      IOS_BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Set temporary build directory
        run: echo "IOS_CI_DIR=$RUNNER_TEMP/miniq-ios" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate release inputs, source, and secrets
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: node scripts/ios_testflight.mjs validate
      - name: Test and build mobile frontend
        run: |
          node --test scripts/ios_testflight.node-test.mjs
          npx vitest run src/components/MobileEntry.test.ts src/remoteCrypto.test.ts src/remotePayload.test.ts src/remoteBlob.test.ts src/hooks/useDaemonConnection.test.ts src/hooks/useDaemonConnection.integration.test.tsx
          npm run build
          npx cap sync ios
          xcodebuild -list -json -project ios/App/App.xcodeproj | tee "$IOS_CI_DIR-project.json"
          grep -q '"App"' "$IOS_CI_DIR-project.json"
      - name: Import distribution certificate and App Store profile
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          umask 077
          mkdir -p "$IOS_CI_DIR" "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$IOS_CI_DIR/distribution.p12"
          printf '%s' "$IOS_APP_PROFILE_BASE64" | base64 --decode > "$IOS_CI_DIR/app.mobileprovision"
          printf '%s' "$ASC_PRIVATE_KEY_BASE64" | base64 --decode > "$IOS_CI_DIR/AuthKey.p8"
          security cms -D -i "$IOS_CI_DIR/app.mobileprovision" > "$IOS_CI_DIR/app.plist"
          openssl pkey -in "$IOS_CI_DIR/AuthKey.p8" -check -noout

          keychain_password=$(openssl rand -hex 32)
          security create-keychain -p "$keychain_password" "$IOS_CI_DIR/signing.keychain-db"
          security set-keychain-settings -lut 7200 "$IOS_CI_DIR/signing.keychain-db"
          security unlock-keychain -p "$keychain_password" "$IOS_CI_DIR/signing.keychain-db"
          security import "$IOS_CI_DIR/distribution.p12" -P "$IOS_CERTIFICATE_PASSWORD" \
            -t cert -f pkcs12 -k "$IOS_CI_DIR/signing.keychain-db" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$IOS_CI_DIR/signing.keychain-db" >/dev/null
          security list-keychains -d user -s "$IOS_CI_DIR/signing.keychain-db" "$HOME/Library/Keychains/login.keychain-db"

          identities=$(security find-identity -v -p codesigning "$IOS_CI_DIR/signing.keychain-db")
          identity=$(printf '%s\n' "$identities" | sed -nE 's/.* ([A-F0-9]{40}) "Apple Distribution:.*$/\1/p')
          if [ "$(printf '%s\n' "$identity" | sed '/^$/d' | wc -l | tr -d ' ')" != "1" ]; then
            echo 'Expected exactly one Apple Distribution identity in IOS_CERTIFICATE_BASE64' >&2
            exit 1
          fi
          printf '%s\n' "$identities" | grep -F "($APPLE_TEAM_ID)" >/dev/null
          echo "IOS_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Validate and install App Store profile
        id: signing
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_PROFILE_PLIST: ${{ runner.temp }}/miniq-ios/app.plist
          IOS_EXPORT_OPTIONS: ${{ runner.temp }}/miniq-ios/ExportOptions.plist
        run: node scripts/ios_testflight.mjs prepare-profile
      - name: Install App Store profile
        run: |
          profile_dir="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$profile_dir"
          cp "$IOS_CI_DIR/app.mobileprovision" "$profile_dir/${{ steps.signing.outputs.profile_uuid }}.mobileprovision"
      - name: Archive signed iOS app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$IOS_CI_DIR/miniQ.xcarchive" \
            -resultBundlePath "$IOS_CI_DIR/Archive.xcresult" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$IOS_SIGNING_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
            MARKETING_VERSION="$IOS_MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER" archive \
            | tee "$IOS_CI_DIR/archive.log"
          codesign --verify --deep --strict "$IOS_CI_DIR/miniQ.xcarchive/Products/Applications/App.app"
          info="$IOS_CI_DIR/miniQ.xcarchive/Products/Applications/App.app/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$info")" = "com.leadingthink.miniq"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$info")" = "$IOS_MARKETING_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$info")" = "$IOS_BUILD_NUMBER"
      - name: Export signed IPA
        run: |
          set -o pipefail
          xcodebuild -exportArchive -archivePath "$IOS_CI_DIR/miniQ.xcarchive" \
            -exportOptionsPlist "$IOS_CI_DIR/ExportOptions.plist" \
            -exportPath "$IOS_CI_DIR/export" | tee "$IOS_CI_DIR/export.log"
          ipa_files=("$IOS_CI_DIR"/export/*.ipa)
          if [ "${#ipa_files[@]}" -ne 1 ] || [ ! -f "${ipa_files[0]}" ]; then
            echo 'Expected exactly one exported IPA' >&2
            exit 1
          fi
          echo "IOS_IPA=${ipa_files[0]}" >> "$GITHUB_ENV"
      - name: Upload build to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cp "$IOS_CI_DIR/AuthKey.p8" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --upload-app --type ios --file "$IOS_IPA" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" --output-format json \
            | tee "$IOS_CI_DIR/upload.log"
      - name: Save IPA and debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: miniq-ios-${{ inputs.marketing_version }}-${{ inputs.build_number }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/miniq-ios/export/*.ipa
            ${{ runner.temp }}/miniq-ios/miniQ.xcarchive/dSYMs
          if-no-files-found: error
          retention-days: 14
      - name: Save build logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: miniq-ios-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/miniq-ios/*.log
            ${{ runner.temp }}/miniq-ios/*.xcresult
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove temporary signing material
        if: ${{ always() }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          if [ -f "$IOS_CI_DIR/signing.keychain-db" ]; then
            security delete-keychain "$IOS_CI_DIR/signing.keychain-db"
          fi
          profile="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/${{ steps.signing.outputs.profile_uuid }}.mobileprovision"
          rm -f "$profile" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          rm -rf "$IOS_CI_DIR"
