# Install as /etc/systemd/system/miniq-relay.service.d/push.conf.
# Persists mobile push registrations so phones need not re-register after a relay restart.
# APNs / JPush credentials go in /etc/miniq-relay/blob.env (see docs/remote-push.md).
[Service]
Environment=MINIQ_PUSH_REGISTRY_FILE=/home/ubuntu/miniq-relay/push/registry.json
