[package]
name = "miniq-tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
miniq-protocol = { path = "../miniq-protocol" }
miniq-sandbox = { path = "../miniq-sandbox" }
miniq-models = { path = "../miniq-models" }
miniq-skills = { path = "../miniq-skills" }
miniq-docs = { path = "../miniq-docs" }
miniq-memory = { path = "../miniq-memory" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
ignore = { workspace = true }
globset = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
base64 = "0.22"
futures-util = { workspace = true }
html2text = { workspace = true }
url = { workspace = true }
schemars = { workspace = true }
uuid = { workspace = true }
tokio-util = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
tempfile = "3"
enigo = "0.6.1"
xcap = "0.8.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.25", features = ["elcapitan"] }
core-foundation = "0.10"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "NSGraphicsContext", "objc2-core-graphics"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSProcessInfo"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGEvent", "CGEventSource", "CGEventTypes", "libc"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
lopdf = "0.34"
axum = { workspace = true }
