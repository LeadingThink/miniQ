id = "miniq.official.figma"
name = "Figma 设计协作"
version = "1.1.0"
api_version = "1.0.0"
runtime = "skills"
capabilities = ["skills"]
skills = ["figma-design-to-code", "figma-design-system-rules", "figma-implement-motion", "figma-code-connect", "figma-swiftui", "figma-use", "figma-generate-design", "figma-generate-library", "figma-generate-diagram", "figma-use-figjam", "figma-use-slides", "figma-use-motion", "figma-create-new-file", "figma-rest-export"]
requires = ["npx", "python3"]
description = "读取 Figma 设计稿与变量还原为代码，并通过官方 MCP 在 Figma/FigJam/Slides 中搭建页面、设计系统、图表与动效"
author = "miniQ"

[[mcp_servers]]
name = "figma"
description = "Figma 官方远程 MCP（OAuth 登录；仅 Figma MCP 目录内的客户端可连接，可能被拒）"
command = "npx"
args = ["-y", "mcp-remote@latest", "https://mcp.figma.com/mcp"]

[[mcp_servers]]
name = "figma-desktop"
description = "Figma 桌面应用本地 MCP（需在桌面端 Dev Mode 启用，付费 Dev/Full 席位）"
command = "npx"
args = ["-y", "mcp-remote@latest", "http://127.0.0.1:3845/mcp"]
