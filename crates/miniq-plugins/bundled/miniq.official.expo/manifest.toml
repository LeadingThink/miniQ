id = "miniq.official.expo"
name = "Expo"
version = "1.0.0"
api_version = "1.0.0"
runtime = "skills"
capabilities = ["skills"]
skills = ["expo-app-dev", "expo-eas-build"]
requires = ["npx"]
description = "开发调试 Expo 应用，并用 EAS 构建、提交商店与发布更新"
author = "miniQ"

[[mcp_servers]]
name = "expo"
description = "Expo 官方远程 MCP（需 Expo 账号，首次使用会在浏览器中 OAuth 登录）"
command = "npx"
args = ["-y", "mcp-remote@latest", "https://mcp.expo.dev/mcp"]
env = []
