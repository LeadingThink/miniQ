id = "miniq.official.expo"
name = "Expo"
version = "1.1.0"
api_version = "1.0.0"
runtime = "skills"
capabilities = ["skills"]
skills = ["expo-app-dev", "expo-eas-build", "building-native-ui", "expo-api-routes", "expo-cicd-workflows", "expo-deployment", "expo-dev-client", "expo-module", "expo-tailwind-setup", "expo-ui-jetpack-compose", "expo-ui-swift-ui", "native-data-fetching", "upgrading-expo", "use-dom"]
requires = ["npx"]
description = "Expo 官方技能全集：UI 开发、原生模块、数据获取、升级、EAS 构建提交与 OTA 更新"
author = "miniQ"

[[mcp_servers]]
name = "expo"
description = "Expo 官方远程 MCP（需 Expo 账号，首次使用会在浏览器中 OAuth 登录）"
command = "npx"
args = ["-y", "mcp-remote@latest", "https://mcp.expo.dev/mcp"]
env = []
