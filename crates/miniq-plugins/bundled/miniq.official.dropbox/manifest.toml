id = "miniq.official.dropbox"
name = "Dropbox 云盘"
version = "1.1.0"
api_version = "1.0.0"
runtime = "skills"
capabilities = ["skills"]
skills = ["dropbox-files", "dropbox-find", "dropbox-inspect", "dropbox-organize", "dropbox-share", "dropbox-cleanup", "dropbox-file-request"]
requires = ["npx"]
description = "通过 Dropbox 官方 MCP 查找、查看、读取与保存文件，整理文件夹、按需创建共享链接与文件请求，并在审阅确认后清理内容"
author = "miniQ"

[[mcp_servers]]
name = "dropbox"
description = "Dropbox 官方远程 MCP（首次使用会在浏览器中 OAuth 登录），提供搜索、浏览、读取、整理、共享链接与文件请求工具"
command = "npx"
args = ["-y", "mcp-remote@latest", "https://mcp.dropbox.com/mcp"]
env = []
