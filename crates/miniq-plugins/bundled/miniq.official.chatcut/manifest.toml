id = "miniq.official.chatcut"
name = "ChatCut 对话剪辑"
version = "1.1.0"
api_version = "1.0.0"
runtime = "skills"
capabilities = ["skills"]
skills = ["chatcut-edit-plan", "chatcut-ffmpeg-edit", "chatcut-subtitles", "chatcut-cloud-edit"]
requires = ["ffmpeg", "ffprobe"]
description = "用对话剪视频：多素材编排成片、去静音、转写/翻译/烧录字幕、拼接与多平台竖屏导出，本机 ffmpeg 优先，可选接 ChatCut 云端"
author = "miniQ"

[[mcp_servers]]
name = "chatcut"
description = "ChatCut 官方远程 MCP（OAuth 登录；素材会上传到 ChatCut 云端）"
command = "npx"
args = ["-y", "mcp-remote@latest", "https://api.chatcut.io/api/external-mcp/mcp", "--header", "x-chatcut-mcp-client:miniq"]
